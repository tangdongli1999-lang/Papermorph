<!doctype html>
<html lang="en" data-stage="portrait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which One Is Mia?</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
<style>#bCC { display: none; }   /* the captions are burned into the picture (hsCaptions), as a Short's are */</style>
</head>
<body>
<!-- Which One Is Mia?, an upright horror Short: five scenes, one beat each, on the approved voice-over. -->
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/mia.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script src="../lib/shared.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script src="scene5.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Which One Is Mia?', minutes: 1, language: 'en', film: true, questionKeys: false };
setCaptions(false, false);   // the captions are drawn on the stage by each scene (white; the bed Mia red)

const BEATS = [
  ['scene1', 'The voicemail', (m, D) => scene1(panel(0), D, m), { lead: false, pre: PRE1 }],
  ['scene2', 'The knock', (m, D) => scene2(panel(0), D, m), { lead: false, pre: PRE2 }],
  ['scene3', 'The lock', (m, D) => scene3(panel(0), D, m), { lead: false, pre: PRE3 }],
  ['scene4', 'The bed', (m, D) => scene4(panel(0), D, m), { lead: false, pre: PRE4 }],
  ['scene5', 'Which one', (m, D) => scene5(panel(0), D, m), { lead: false, dur: SCENE5_DUR }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The room's tone: one 60 s track under every scene (sfx_recipes.py roombed), so it never restarts at a cut; it dies
// with the phone's light at the end.
music('audio/bgm/roombed.mp3', ['scene1', 'scene2', 'scene3', 'scene4', 'scene5'], .35, .05);
window.MUSIC_OFF = { scene5: t => t >= PHONE_DIES5 };

paperWarm(g => { jessPuppet(g); miaPuppet(g); dormDoor(g); dormBed(g, 0, 0); });
boot();
</script>
</body>
</html>
