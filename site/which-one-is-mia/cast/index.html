<!doctype html>
<html lang="en" data-stage="portrait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Which One Is Mia: cast sheet</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<!-- A scratch page, not part of the film: the cast at rest and in key poses, the phone and the door, for approval. -->
<script src="../lib/engine.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/mia.js"></script>
<script>
'use strict';
const CHAPTER = { number: 0, title: 'Cast sheet', minutes: 1, language: 'en', film: true, questionKeys: false };
const TIMINGS = {};
function castSheet(p, D) {
  const g = mk('g', {}, p);
  g.innerHTML = `<defs><linearGradient id="csBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#151b30"/></linearGradient>
      <radialGradient id="phoneLight" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#9fc3ff" stop-opacity=".35"/><stop offset="1" stop-color="#9fc3ff" stop-opacity="0"/></radialGradient></defs>
    <rect width="900" height="1600" fill="url(#csBg)"/>${[600, 1060].map(y => `<rect x="40" y="${y}" width="820" height="3" fill="#1e2640"/>`).join('')}`;
  const txt = (x, y, s, size = 26, fill = '#c9cfe0', anchor = 'start') => mk('text', { x, y, fill, 'font-size': size, 'font-family': 'Georgia, serif', 'letter-spacing': 3, 'text-anchor': anchor }, g).textContent = s;
  txt(450, 80, 'WHICH ONE IS MIA? — CAST', 32, '#e8e2d2', 'middle');
  txt(60, 140, 'JESS'); txt(60, 650, 'MIA'); txt(60, 1110, 'THE PHONE · THE DOOR');
  [[150, 'at rest'], [450, 'woken, phone'], [740, 'at the lock']].forEach(([x, s]) => txt(x, 585, s, 20, '#8790a8', 'middle'));
  [[150, 'contact photo'], [450, 'at rest'], [740, 'sitting up in bed']].forEach(([x, s]) => txt(x, 1045, s, 20, '#8790a8', 'middle'));
  txt(230, 1560, 'the voicemail', 20, '#8790a8', 'middle'); txt(650, 1560, 'light and two feet', 20, '#8790a8', 'middle');

  const S = 1.0, gy1 = 560, gy2 = 1020;
  mk('circle', { cx: 450, cy: 360, r: 150, fill: 'url(#phoneLight)' }, g);
  const jess = [jessPuppet(g), jessPuppet(g), jessPuppet(g)];
  const avatar = mk('g', {}, g); avatar.innerHTML = miaAvatar(150, 860, 110);
  const bedG = mk('g', { transform: 'translate(560,40) scale(.82)' }, g);
  const bed = dormBed(bedG, 0, 1240, { w: 360 });
  const mia = miaPuppet(g), miaBed = miaPuppet(bed.slot);
  bed.dv.parentNode.appendChild(bed.dv);
  const vm = voicemailScreen(mk('g', { transform: 'translate(150,1130) scale(.25)' }, g));
  const doorG = mk('g', { transform: 'translate(415,975) scale(.5)' }, g), door = dormDoor(doorG);

  stopClock(D, (q, f) => {
    jess[0].pose({ x: 150, y: hipOn(gy1, S), s: S, head: 'F', turn: 0, rua: 6, lua: -6 }, f);
    const j1 = { x: 450, y: hipOn(gy1, S), s: S, head: 'F', turn: 0 }, ph = frontReach(j1, 'R', [j1.x + 6, j1.y - 112]);
    jess[1].pose({ ...j1, rua: ph.rua, rfa: ph.rfa, hold: 'phone', lua: -6, nod: 8, brow: .5, look: .1, mouth: 'B' }, f);
    jess[2].pose({ x: 720, y: hipOn(gy1, S), s: S, turn: 1, ua: -52, fa: -40, nod: 4, look: .6, brow: .7 }, f);
    mia.pose({ x: 450, y: hipOn(gy2, S), s: S, head: 'F', turn: 0, rua: 6, lua: -6, mouth: 'X' }, f);
    miaBed.pose({ x: 190, y: 1240 - 40, s: 1.15, head: 'F', turn: 0, rua: 6, lua: -6, look: 0, mouth: 'A' }, f);
    bed.pose({ lump: .6 });
    vm.pose({ q, progress: .4 }, f);
    door.pose({ lock: .3, feet: 1, shift: 0 }, f);
  });
}
const BEATS = [{ id: 'cast', title: 'Cast', run: (m, D) => castSheet(panel(0), D), lead: false, dur: 3 }];
boot();
</script>
</body>
</html>
