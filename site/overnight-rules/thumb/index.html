<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Overnight Rules: thumbnail</title>

<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<!-- A scratch page, not part of the film: the YouTube thumbnail. -->
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/rules.js"></script>
<script src="../lib/shared.js"></script>
<script>
'use strict';
const CHAPTER = { number: 0, title: 'Thumbnail', minutes: 1, language: 'en', film: true, questionKeys: false };
const TIMINGS = {};
// The thumbnail: camera four, grainy, the other Dani in aisle four waving with her black eyes and too-wide smile; the
// real Dani's face, huge, at the right, terrified, a red rim of light; big words at the top left; a red ring and arrow
// on the figure in the feed. variant 0: THAT'S NOT ME / variant 1: RULE 6 / DON'T GO
function thumb(p, D, variant, plain = false) {
  const gridG = mk('g', { style: 'filter:contrast(1.25) brightness(1.05)' }, p), grid = cctv(gridG), other = daniPuppet(grid.slot4, { other: true });
  tf(gridG, `translate(800,450) scale(1.06) translate(-800,-450) translate(-250,18) ${grid.zoomTo(4, 1)}`);
  const shade = mk('g', {}, p);
  shade.innerHTML = `<defs><linearGradient id="tR" x1="0" x2="1"><stop offset=".35" stop-color="#000" stop-opacity="0"/><stop offset=".72" stop-color="#05070a" stop-opacity=".88"/></linearGradient>
    <radialGradient id="tRim" cx="1700" cy="900" r="700" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff2a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ff2a1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="tV" cx="45%" cy="50%" r="75%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></radialGradient></defs>
    <rect width="1600" height="900" fill="url(#tR)"/><rect width="1600" height="900" fill="url(#tRim)"/>`;
  const face = daniPuppet(p);
  // a scream: an open oval mouth over her own
  face.g.querySelector('[data-p=headF] > g').insertAdjacentHTML('beforeend', `<ellipse cx="0" cy="-167" rx="11" ry="9" fill="${DANI_COL.skin}"/><ellipse cx="0" cy="-163" rx="8.5" ry="13" fill="#2a0e10"/><ellipse cx="0" cy="-156" rx="5" ry="3.5" fill="#b8525a"/>`);
  const top = mk('g', {}, p);
  top.innerHTML = `<rect width="1600" height="900" fill="url(#tV)"/>
    <g fill="none" stroke="#ff2a1f" stroke-width="12" stroke-linecap="round" ${plain ? 'display="none"' : ''}><circle cx="292" cy="418" r="150"/>
      <path d="M745,330 Q600,320 462,380"/><path d="M472,336 L452,384 L504,394"/></g>
    <g font-family="monospace" font-size="78" font-weight="700" paint-order="stroke" stroke="#000" stroke-width="8"><circle cx="70" cy="84" r="25" fill="#ff2a1f"/><text x="112" y="110" fill="#fff">REC CAM 4</text></g>
    <g font-family="'Inter Display Black','Inter Display',Inter,sans-serif" font-weight="900" paint-order="stroke" stroke="#000" stroke-linejoin="round">
      ${variant ? `<text x="1575" y="215" text-anchor="end" font-size="245" fill="#ffffff" stroke-width="26" letter-spacing="-6">RULE 6</text>
                   <text x="1575" y="375" text-anchor="end" font-size="165" fill="#ff2a1f" stroke-width="24" letter-spacing="-5">WAS A LIE</text>`
                : `<text x="1575" y="205" text-anchor="end" font-size="215" fill="#ffffff" stroke-width="26" letter-spacing="-6">THAT'S</text>
                   <text x="1575" y="390" text-anchor="end" font-size="215" fill="#ff2a1f" stroke-width="26" letter-spacing="-6">NOT ME</text>`}
    </g>`;
  stopClock(D, (q, f) => {
    grid.pose({ t: '04:51:07' });
    other.pose({ x: 300, y: hipOn(445, .72), s: .72, head: 'F', turn: 0, lua: -6, rua: -96, rfa: -78, nod: -2 }, f);
    face.pose({ x: 1290, y: 1560, s: 5.0, head: 'F', turn: 0, rua: 4, lua: -4, look: -1, brow: 1, mouth: 'X', nod: -4 }, f);
  });
}
// just the camera: camera four, full frame, the other Dani standing in the middle of the aisle, waving; REC and the time
function camOnly(p, D) {
  const gridG = mk('g', { style: 'filter:contrast(1.25) brightness(1.05)' }, p), grid = cctv(gridG), other = daniPuppet(grid.slot4, { other: true });
  tf(gridG, `translate(800,450) scale(1.06) translate(-800,-450) ${grid.zoomTo(4, 1)}`);
  gridG.querySelectorAll('text, circle').forEach(e => e.setAttribute('display', 'none'));   // the feed's own small labels: ours replace them
  const top = mk('g', {}, p);
  top.innerHTML = `<defs><radialGradient id="cV" cx="50%" cy="50%" r="72%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/></radialGradient></defs>
    <rect width="1600" height="900" fill="url(#cV)"/>
    <g font-family="monospace" font-size="78" font-weight="700" paint-order="stroke" stroke="#000" stroke-width="8"><circle cx="70" cy="84" r="25" fill="#ff2a1f"/><text x="112" y="110" fill="#fff">REC CAM 4</text>
      <text x="1550" y="850" text-anchor="end" fill="#fff">04:51:07</text></g>`;
  stopClock(D, (q, f) => {
    grid.pose({ t: '04:51:07' });
    other.pose({ x: 400, y: hipOn(450, .74), s: .74, head: 'F', turn: 0, lua: -6, rua: -96, rfa: -78, nod: -2 }, f);
  });
}
const BEATS = [
  { id: 'notme', title: 'That\'s not me', run: (m, D) => thumb(panel(0), D, 0), lead: false, dur: 2 },
  { id: 'rule6', title: 'Rule 6', run: (m, D) => thumb(panel(0), D, 1), lead: false, dur: 2 },
  { id: 'cam', title: 'Camera only', run: (m, D) => camOnly(panel(0), D), lead: false, dur: 2 },
  { id: 'notmeP', title: 'That\'s not me, plain', run: (m, D) => thumb(panel(0), D, 0, true), lead: false, dur: 2 },
  { id: 'rule6P', title: 'Rule 6, plain', run: (m, D) => thumb(panel(0), D, 1, true), lead: false, dur: 2 },
];
boot();
</script>
</body>
</html>
