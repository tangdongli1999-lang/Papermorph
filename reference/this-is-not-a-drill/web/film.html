<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#000;overflow:hidden;width:1920px;height:1080px}
#stage,#ov,.vig{position:absolute;inset:0;width:1920px;height:1080px}
#stage canvas{display:block}
.vig{pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}
.title{position:absolute;left:0;right:0;top:330px;height:420px;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(90deg,rgba(0,0,0,0),rgba(0,0,0,.72) 25%,rgba(0,0,0,.72) 75%,rgba(0,0,0,0));font:900 150px/1.05 'DejaVu Sans',Arial,sans-serif;color:#fff;letter-spacing:4px;text-shadow:0 7px 0 #a01818}
.typed{position:absolute;left:110px;bottom:120px;font:700 64px/1 'Courier New',monospace;color:#fff;background:rgba(0,0,0,.55);padding:18px 28px;border-left:8px solid #c62828}
.cur{color:#c62828}
.phone{position:absolute;left:50%;top:50%;width:420px;height:820px;margin:-410px 0 0 -210px;border-radius:56px;background:#111;box-shadow:0 0 0 14px #2b2b2b,0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;font-family:Arial,sans-serif;color:#fff}
.ph-time{margin-top:120px;font:300 110px/1 Arial,sans-serif}
.ph-toggle{margin-top:200px;padding:26px 40px;border-radius:40px;background:#333;font:600 38px/1 Arial;transition:none}
.ph-toggle.on{background:#c62828}
.black{position:absolute;inset:0;background:#000}
.flash{position:absolute;inset:0;background:#fff}
.otext{position:absolute;white-space:nowrap;font-family:'DejaVu Sans',Arial,sans-serif;font-weight:700;text-shadow:0 3px 14px rgba(0,0,0,.6)}
.otext.plaque{background:#1f3b63;color:#fff;padding:6px 18px;border-radius:6px;border:3px solid #c9d3e3;text-shadow:none;letter-spacing:2px}
.otext.faint{font-weight:300;color:#fff;text-shadow:0 0 18px rgba(255,255,255,.4)}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,rgba(0,0,0,.18) 2px 4px)}
.cctv{position:absolute;left:60px;top:50px;font:700 40px/1.35 'DejaVu Sans Mono',monospace;color:#e8e8e8;text-shadow:0 0 6px #000}
.rec{color:#ff3b3b}
.glow{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(185,215,255,.9),rgba(130,180,255,.35) 40%,rgba(0,0,0,0) 70%);mix-blend-mode:screen}
.shoes{position:absolute;transform-origin:50% 50%}
.clockbg{position:absolute;inset:0;background:#8f8a7e;display:flex;align-items:center;justify-content:center}
.clockbg .clock{filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.clocklabel{position:absolute;right:120px;bottom:90px;font:700 64px/1 'DejaVu Sans Mono',monospace;color:#fff;background:rgba(0,0,0,.55);padding:14px 24px;border-left:8px solid #c62828}
.chat{position:absolute;left:50%;top:50%;width:600px;height:960px;margin:-480px 0 0 -300px;border-radius:60px;background:#0d0f14;box-shadow:0 0 0 16px #2a2a2a,0 40px 90px rgba(0,0,0,.7);overflow:hidden;font-family:'DejaVu Sans',Arial,sans-serif}
.chathead{height:120px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;box-sizing:border-box;background:#1a1d24;color:#fff;font:700 34px/1 'DejaVu Sans';border-bottom:1px solid #2c313b}
.chatbody{position:absolute;left:0;right:0;bottom:30px;display:flex;flex-direction:column;gap:16px;padding:0 26px}
.msg{align-self:flex-start;max-width:470px;background:#262b35;color:#f1f1f1;padding:16px 22px;border-radius:26px;font:400 30px/1.3 'DejaVu Sans'}
.msg b{display:block;font-size:24px;margin-bottom:4px}
.msg.me{align-self:flex-end;background:#2f6fe4}
.msg.alert{background:#5b1d1d}
.msg i{display:block;font-size:22px;color:#9aa3b2;margin-top:6px;text-align:right}
#stage{background:#000}
.rotor{position:absolute;border-radius:40% / 22%;background:linear-gradient(90deg,#9d968c,#d6d0c6 45%,#b9b2a7);box-shadow:0 4px 8px rgba(0,0,0,.35)}
.lite{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
.dust{position:absolute;inset:0;mix-blend-mode:screen}
.dust i{position:absolute;border-radius:50%;background:rgba(255,240,205,.9);box-shadow:0 0 6px rgba(255,235,190,.8)}
.words{position:absolute;transform:translate(-50%,-50%);font-family:'DejaVu Sans',sans-serif;font-weight:900;letter-spacing:2px;text-transform:uppercase;white-space:nowrap;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.9)}
</style></head><body><div id="stage"></div><div class="vig"></div><div id="ov"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="dong.js"></script><script src="set.js"></script><script src="film.js"></script></body></html>
